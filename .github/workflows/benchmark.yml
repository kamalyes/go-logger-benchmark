name: Benchmark

on:
  push:
    branches: [master]
    paths-ignore:
      - "benchmarks/**"
      - "BENCHMARKS.md"
      - "README.md"
      - "README_zh.md"
  workflow_dispatch:
    inputs:
      go-logger-ref:
        description: "go-logger ref (tag/branch/sha)"
        required: false
        default: "master"
  repository_dispatch:
    types: [go-logger-updated, upstream-updated]

permissions:
  # 只读：本工作流不再往仓库里提交跑分结果
  # 留着 write 等于给「哪天又把 git push 加回来」开着门，而上一次正是这样
  # 把远端历史截断成了一条提交（checkout 默认 fetch-depth: 1，浅克隆里
  # amend 再 --force，推上去的就是一段只有一条提交的历史）
  #
  # [EN] Read-only: this workflow no longer commits results
  # Leaving write open invites a re-added git push, which is how the remote history was
  # once truncated to a single commit: checkout defaults to fetch-depth 1, and amending
  # inside a shallow clone then force pushing publishes that one-commit history
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Determine go-logger ref
        id: logger-ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MODULE="${{ github.event.client_payload.module }}"
            VERSION="${{ github.event.client_payload.version }}"
            REF="${{ github.event.client_payload.ref }}"
            if [ "$MODULE" = "github.com/kamalyes/go-logger" ] && [ -n "$VERSION" ]; then
              echo "ref=${VERSION}" >> $GITHUB_OUTPUT
            elif [ -n "$REF" ]; then
              REF="${REF#refs/tags/}"
              REF="${REF#refs/heads/}"
              echo "ref=${REF:-master}" >> $GITHUB_OUTPUT
            else
              echo "ref=master" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.go-logger-ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=master" >> $GITHUB_OUTPUT
          fi

      - name: Checkout go-logger at ref
        uses: actions/checkout@v4
        with:
          repository: kamalyes/go-logger
          path: _go-logger
          ref: ${{ steps.logger-ref.outputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Point replace to go-logger source
        run: |
          go mod edit -replace github.com/kamalyes/go-logger=./_go-logger
          go mod tidy

      - name: 正确性闸门：基准能跑通、生成器能解析
        run: |
          # 规范跑法与它的参数定义在 Makefile 里，这里只调闸门目标
          # 不在本步就地写 go test 参数：那等于在工作流里另立一套默认值，
          # 而「这些数是怎么跑出来的」应该只有一个答案
          #
          # 本步不提交任何结果 —— 共享 runner 的数字和上一次不可比，
          # 提交上去会让 BENCHMARKS.md 长期显示一组互相不可比的值
          # 报告里的数由固定的物理机跑 make bench 产出、人工提交
          #
          # [EN] The canonical invocation and its parameters live in the Makefile; this step
          # only calls the gate target
          # Writing go test flags inline here would establish a second set of defaults, and
          # "how were these numbers produced" should have exactly one answer
          # This step commits nothing: a shared runner's numbers are not comparable with the
          # previous ones, and committing them would leave BENCHMARKS.md showing mutually
          # incomparable values
          # The numbers in the report come from make bench on one fixed machine, committed
          # by hand
          make bench-smoke
